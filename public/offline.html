<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Swapp — אין חיבור</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf3e7;
        color: #412402;
        font-family: system-ui, sans-serif;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #fffcf7;
        border: 1px solid #e3d5bc;
        border-radius: 14px;
        padding: 32px;
        max-width: 380px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 8px;
      }
      p {
        color: #8a7a5c;
        font-size: 15px;
        margin: 0 0 20px;
        line-height: 1.6;
      }
      button {
        background: #ef9f27;
        color: #412402;
        border: none;
        border-radius: 999px;
        padding: 12px 28px;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>אין חיבור לאינטרנט</h1>
      <p>
        לוח התורנויות מתעדכן בזמן אמת, ולכן נדרש חיבור. יש להתחבר לרשת ולנסות
        שוב.
      </p>
      <button onclick="location.reload()">נסה שוב</button>
    </div>
  </body>
</html>
